x-airflow-common:
  &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./great_expectations:/opt/airflow/great_expectations
    - ./scripts:/opt/airflow/scripts
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: "airflow-secret-key"
    PYTHONPATH: /opt/airflow/src:/opt/airflow

    # PostgreSQL Source
    POSTGRES_SOURCE_HOST: postgres-source
    POSTGRES_SOURCE_PORT: "5432"
    POSTGRES_SOURCE_USER: school_user
    POSTGRES_SOURCE_PASSWORD: school_pass
    POSTGRES_SOURCE_DB: school_source
    SOURCE_DB_HOST: postgres-source
    SOURCE_DB_PORT: "5432"
    SOURCE_DB_NAME: school_source
    SOURCE_DB_USER: school_user
    SOURCE_DB_PASS: school_pass

    # PostgreSQL Warehouse
    POSTGRES_WAREHOUSE_HOST: postgres-warehouse
    POSTGRES_WAREHOUSE_PORT: "5432"
    POSTGRES_WAREHOUSE_USER: warehouse_user
    POSTGRES_WAREHOUSE_PASSWORD: warehouse_pass
    POSTGRES_WAREHOUSE_DB: school_warehouse
    WH_DB_HOST: postgres-warehouse
    WH_DB_PORT: "5432"
    WH_DB_NAME: school_warehouse
    WH_DB_USER: warehouse_user
    WH_DB_PASS: warehouse_pass

    # MinIO
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minio_admin
    MINIO_SECRET_KEY: minio_pass
    MINIO_BUCKET_RAW: raw-data
    MINIO_BUCKET_STAGING: staging-data

    # API (Mock server chạy trên host)
    API_BASE_URL: http://host.docker.internal:5055
    API_JSON_DIR: /opt/airflow/data/api_json
    API_TIMEOUT: "30"
    API_MAX_RETRIES: "3"

    # CSV
    CSV_DATA_DIR: /opt/airflow/data/csv

    # ETL
    ETL_BATCH_SIZE: "500"
    ETL_LOG_LEVEL: INFO

  networks:
    - school-network

services:

  # =============================
  # PostgreSQL Airflow Metadata
  # =============================
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # =============================
  # PostgreSQL Source
  # =============================
  postgres-source:
    image: postgres:15-alpine
    container_name: postgres-source
    environment:
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_pass
      POSTGRES_DB: school_source
    ports:
      - "5434:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./sql/source:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_source"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # =============================
  # PostgreSQL Warehouse
  # =============================
  postgres-warehouse:
    image: postgres:15-alpine
    container_name: postgres-warehouse
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
      POSTGRES_DB: school_warehouse
    ports:
      - "5435:5432"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
      - ./sql/warehouse:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d school_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # =============================
  # Airflow Init
  # =============================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      --password admin"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    restart: on-failure

  # =============================
  # Airflow Webserver
  # =============================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # =============================
  # Airflow Scheduler
  # =============================
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # =============================
  # MinIO
  # =============================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - school-network

  # =============================
  # Prometheus
  # =============================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - school-network
    restart: unless-stopped

  # =============================
  # Grafana
  # =============================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - school-network
    restart: unless-stopped

  # =============================
  # pgAdmin
  # =============================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@school.edu
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - school-network
    restart: unless-stopped

volumes:
  postgres_airflow_data:
  postgres_source_data:
  postgres_warehouse_data:
  minio_data:
  grafana_data:
  prometheus_data:
  pgadmin_data:

networks:
  school-network:
    driver: bridge