global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: [ "pushgateway:9091" ]

  - job_name: "airflow"
    static_configs:
      - targets: [ "statsd-exporter:9102" ]
  # monitoring/prometheus.yml
  - job_name: "postgres_source"
    static_configs:
      - targets: [ "postgres-exporter-source:9187" ]
  - job_name: "postgres_warehouse"
    static_configs:
      - targets: [ "postgres-exporter-warehouse:9187" ]
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [ "minio:9000" ]
