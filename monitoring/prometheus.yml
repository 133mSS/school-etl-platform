# =====================================================================
# prometheus.yml — Cấu hình Prometheus cho ETL Platform PTIT
# =====================================================================
# So với bản cũ đã thêm:
#   - rule_files: load alert_rules.yml
#   - alerting: gửi alert qua Alertmanager
#   - postgres_source / postgres_warehouse trỏ vào exporter mới
# =====================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s          # Tần suất evaluate alert rules
  external_labels:
    cluster: 'etl-platform-ptit'
    environment: 'dev'

# ────────────────────────────────────────────────────────────────────
# RULE FILES — Prometheus sẽ load các alert rule từ đây
# ────────────────────────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# ────────────────────────────────────────────────────────────────────
# ALERTING — gửi alert đã fire sang Alertmanager
# ────────────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
      # Timeout khi push alert sang AM
      timeout: 10s
      # API version v2 (mặc định cho AM 0.16+)
      api_version: v2

# ────────────────────────────────────────────────────────────────────
# SCRAPE CONFIGS — các target Prometheus sẽ pull metrics
# ────────────────────────────────────────────────────────────────────
scrape_configs:
  # Self-monitor
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Custom ETL metrics push lên Pushgateway
  - job_name: "pushgateway"
    honor_labels: true              # Quan trọng: giữ label run_id từ pipeline
    static_configs:
      - targets: ["pushgateway:9091"]

  # Airflow metrics qua statsd-exporter
  - job_name: "airflow"
    static_configs:
      - targets: ["statsd-exporter:9102"]

  # PostgreSQL Source — qua postgres-exporter
  - job_name: "postgres_source"
    static_configs:
      - targets: ["postgres-exporter-source:9187"]
        labels:
          db_role: "source"

  # PostgreSQL Warehouse — qua postgres-exporter
  - job_name: "postgres_warehouse"
    static_configs:
      - targets: ["postgres-exporter-warehouse:9187"]
        labels:
          db_role: "warehouse"

  # MinIO native metrics (bearer token nếu enable auth)
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # Alertmanager self-monitor
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]