# =====================================================================
# great_expectations/checkpoints/daily_checkpoint.yml
# =====================================================================
# Checkpoint chay hang ngay trong Airflow task "validate_data"
# thong qua ge_validation.py — DataValidator.validate_from_staging()
#
# Thu tu validation:
#   1. students_suite   → sinh_vien (PostgreSQL)
#   2. grades_suite     → diem_hoc_phan (PostgreSQL)
#   3. ctsv_suite       → ctsv_data (CSV Phong CTSV)
#   4. tai_chinh_suite  → tai_chinh_data (API JSON vendor)
# =====================================================================

name: daily_checkpoint
config_version: 1.0
class_name: Checkpoint
run_name_template: "%Y%m%d-%H%M%S-daily-ptit"

validations:
  - batch_request:
      datasource_name: nguon1_postgres
      data_connector_name: default_runtime_data_connector
      data_asset_name: sinh_vien
      runtime_parameters:
        batch_data: "__df_students__"
      batch_identifiers:
        run_id: "__run_id__"
    expectation_suite_name: students_suite
    action_list:
      - name: store_validation_result
        action:
          class_name: StoreValidationResultAction
      - name: update_data_docs
        action:
          class_name: UpdateDataDocsAction
          site_names:
            - local_site

  - batch_request:
      datasource_name: nguon1_postgres
      data_connector_name: default_runtime_data_connector
      data_asset_name: diem_hoc_phan
      runtime_parameters:
        batch_data: "__df_grades__"
      batch_identifiers:
        run_id: "__run_id__"
    expectation_suite_name: grades_suite
    action_list:
      - name: store_validation_result
        action:
          class_name: StoreValidationResultAction
      - name: update_data_docs
        action:
          class_name: UpdateDataDocsAction
          site_names:
            - local_site

  - batch_request:
      datasource_name: nguon2_csv
      data_connector_name: default_runtime_data_connector
      data_asset_name: ctsv_data
      runtime_parameters:
        batch_data: "__df_ctsv__"
      batch_identifiers:
        run_id: "__run_id__"
        hoc_ky: "__hoc_ky__"
    expectation_suite_name: ctsv_suite
    action_list:
      - name: store_validation_result
        action:
          class_name: StoreValidationResultAction
      - name: update_data_docs
        action:
          class_name: UpdateDataDocsAction
          site_names:
            - local_site

  - batch_request:
      datasource_name: nguon3_api_json
      data_connector_name: default_runtime_data_connector
      data_asset_name: tai_chinh_data
      runtime_parameters:
        batch_data: "__df_tc__"
      batch_identifiers:
        run_id: "__run_id__"
        hoc_ky: "__hoc_ky__"
    expectation_suite_name: tai_chinh_suite
    action_list:
      - name: store_validation_result
        action:
          class_name: StoreValidationResultAction
      - name: update_data_docs
        action:
          class_name: UpdateDataDocsAction
          site_names:
            - local_site

action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
      site_names:
        - local_site

evaluation_parameters: {}
runtime_configuration: {}
